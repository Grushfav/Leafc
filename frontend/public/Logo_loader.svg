<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%" class="crest-website-loader">
  <defs>
    <!-- Gold gradients -->
    <linearGradient id="ldrGoldLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8CCA0" />
      <stop offset="50%" stop-color="#D4AF67" />
      <stop offset="100%" stop-color="#C49D52" />
    </linearGradient>
    <linearGradient id="ldrGoldDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C5A15A" />
      <stop offset="50%" stop-color="#B28E49" />
      <stop offset="100%" stop-color="#997534" />
    </linearGradient>
    <linearGradient id="ldrNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#184273" />
      <stop offset="50%" stop-color="#0E2D4F" />
      <stop offset="100%" stop-color="#081E36" />
    </linearGradient>

    <!-- Orbital spinner gradient -->
    <linearGradient id="orbitalGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF67" stop-opacity="1" />
      <stop offset="50%" stop-color="#E8CCA0" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0E2D4F" stop-opacity="0" />
    </linearGradient>

    <!-- Specular light sweep -->
    <linearGradient id="ldrShimmer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <clipPath id="ldrLogoClip">
      <path d="
        M 77 24 L 118.5 37.5 L 111 44 L 77 33.5 L 34 46 L 34 48 L 46 48 L 70 42 L 70 56 L 25 56 L 25 39 Z
        M 30 61 L 39 61 L 39 96 C 39 101, 41 104, 45 104 L 45 61 L 54 61 L 54 115 C 54 118, 56 120, 60 120 L 60 61 L 69 61 L 69 135 C 45 129, 30 112, 30 90 Z
        M 125 39.5 C 127 49, 127.5 59, 127 73.5 L 105 75 C 104 65, 103 57, 105.5 53 C 111 48, 118 43.5, 125 39.5 Z
        M 99 58 C 100 65, 100.5 72, 101 78.5 L 91 90 C 89.5 82, 89 74, 89.5 66 C 92.5 63, 96 60, 99 58 Z
        M 84 71 C 85.5 79, 86.5 88, 88 96 L 74 113 C 74 102, 74 94, 75 87 C 77.5 81, 80.5 76, 84 71 Z
        M 105 79 C 112 78.5, 119 78, 126.5 77.5 C 127 84, 126 90, 123.5 94 L 93 96 C 96.5 90, 100.5 84, 105 79 Z
        M 89 101 C 99 100, 109 99, 120 98 C 120 103, 116 110, 110 114 L 79 116 C 82 110, 85.5 105, 89 101 Z
        M 74 121 C 82 120.5, 90 120, 103 119 C 102 123, 97 127, 90 130 C 84 133, 78 135, 74 135.5 Z
      " fill-rule="evenodd" />
    </clipPath>

    <!-- Drop Glow -->
    <filter id="ldrDropGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#D4AF67" flood-opacity="0.25" />
    </filter>
  </defs>

  <style>
    @keyframes spinOrbit {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes pulseBreathing {
      0%, 100% {
        transform: scale(0.97);
        filter: drop-shadow(0 2px 8px rgba(14, 45, 79, 0.4));
      }
      50% {
        transform: scale(1.02);
        filter: drop-shadow(0 4px 18px rgba(212, 175, 103, 0.45));
      }
    }

    @keyframes continuousShimmer {
      0%, 20% {
        transform: translateX(-160px) translateY(-160px) rotate(45deg);
        opacity: 0;
      }
      35% {
        opacity: 0.9;
      }
      50% {
        transform: translateX(180px) translateY(180px) rotate(45deg);
        opacity: 0;
      }
      100% {
        transform: translateX(180px) translateY(180px) rotate(45deg);
        opacity: 0;
      }
    }

    .orbital-ring {
      transform-origin: 80px 80px;
      animation: spinOrbit 1.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    .orbital-ring-reverse {
      transform-origin: 80px 80px;
      animation: spinOrbit 2.6s linear infinite reverse;
      opacity: 0.45;
    }

    .logo-core {
      transform-origin: 80px 80px;
      animation: pulseBreathing 2.4s ease-in-out infinite;
    }

    .shimmer-light {
      animation: continuousShimmer 2.4s ease-in-out infinite;
      mix-blend-mode: overlay;
    }
  </style>

  <!-- Outer Orbital Progress Ring -->
  <circle class="orbital-ring-reverse" cx="80" cy="80" r="72" fill="none" stroke="#D4AF67" stroke-width="1.5" stroke-dasharray="30 70 120 40" stroke-linecap="round" />
  <circle class="orbital-ring" cx="80" cy="80" r="66" fill="none" stroke="url(#orbitalGlow)" stroke-width="2.5" stroke-dasharray="140 180" stroke-linecap="round" />

  <!-- Center Logo Group -->
  <g class="logo-core" transform="translate(5, 5)">
    <!-- Top Navy Roof & Capital -->
    <path fill="url(#ldrNavy)" stroke="#0E2D4F" stroke-width="0.75" fill-rule="evenodd" d="
      M 77 24 L 118.5 37.5 L 111 44 L 77 33.5 L 34 46 L 34 48 L 46 48 L 70 42 L 70 56 L 25 56 L 25 39 Z
    " />

    <!-- Navy Column Shaft -->
    <path fill="url(#ldrNavy)" fill-rule="evenodd" d="
      M 30 61 L 39 61 L 39 96 C 39 101, 41 104, 45 104 L 45 61 L 54 61 L 54 115 C 54 118, 56 120, 60 120 L 60 61 L 69 61 L 69 135 C 45 129, 30 112, 30 90 Z
    " />

    <!-- Golden Leaf Segments -->
    <g>
      <path fill="url(#ldrGoldLight)" d="M 125 39.5 C 127 49, 127.5 59, 127 73.5 L 105 75 C 104 65, 103 57, 105.5 53 C 111 48, 118 43.5, 125 39.5 Z" />
      <path fill="url(#ldrGoldLight)" d="M 99 58 C 100 65, 100.5 72, 101 78.5 L 91 90 C 89.5 82, 89 74, 89.5 66 C 92.5 63, 96 60, 99 58 Z" />
      <path fill="url(#ldrGoldLight)" d="M 84 71 C 85.5 79, 86.5 88, 88 96 L 74 113 C 74 102, 74 94, 75 87 C 77.5 81, 80.5 76, 84 71 Z" />
      <path fill="url(#ldrGoldDark)" d="M 105 79 C 112 78.5, 119 78, 126.5 77.5 C 127 84, 126 90, 123.5 94 L 93 96 C 96.5 90, 100.5 84, 105 79 Z" />
      <path fill="url(#ldrGoldDark)" d="M 89 101 C 99 100, 109 99, 120 98 C 120 103, 116 110, 110 114 L 79 116 C 82 110, 85.5 105, 89 101 Z" />
      <path fill="url(#ldrGoldDark)" d="M 74 121 C 82 120.5, 90 120, 103 119 C 102 123, 97 127, 90 130 C 84 133, 78 135, 74 135.5 Z" />
    </g>

    <!-- Specular Shimmer Sweep -->
    <g clip-path="url(#ldrLogoClip)">
      <rect class="shimmer-light" x="-70" y="-70" width="70" height="240" fill="url(#ldrShimmer)" />
    </g>
  </g>
</svg>
